<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Stream | Professional Video Calling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden font-sans selection:bg-indigo-500">

    <div class="background-anim absolute inset-0 z-0"></div>

    <div class="relative z-10 h-full w-full flex flex-col items-center justify-center p-4">

        <!-- LOBBY SCREEN -->
        <div id="lobby-screen" class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl transition-all duration-500">
            <h1 class="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400 text-center">Nexus Stream</h1>
            <p class="text-gray-400 text-sm text-center mb-8">Secure, Peer-to-Peer Communication</p>

            <div class="space-y-6">
                <!-- User ID Section -->
                <div class="bg-black/40 p-4 rounded-2xl border border-white/10 relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-r from-indigo-500/10 to-purple-500/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <p class="text-xs text-gray-400 mb-1 uppercase tracking-wider">Your Professional ID</p>
                    <div class="flex items-center justify-between relative z-10">
                        <span id="my-id" class="text-2xl font-mono text-indigo-300 font-bold tracking-widest select-all">Loading...</span>
                        <button onclick="copyMyId()" class="p-2 hover:bg-white/10 rounded-lg transition" title="Copy ID">
                            <i class="ph ph-copy text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- Connect Section -->
                <div>
                    <label class="text-xs text-gray-400 mb-2 block uppercase tracking-wider">Connect to Peer</label>
                    <input type="text" id="target-id" placeholder="Paste ID (e.g. IN26802)" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 uppercase transition mb-3">
                    
                    <button onclick="startCallFromLobby()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-500/30 transition-all flex items-center justify-center gap-2">
                        <i class="ph-fill ph-phone-call text-xl"></i> Start Call
                    </button>
                </div>
            </div>
        </div>

        <!-- ACTIVE CALL SCREEN -->
        <div id="call-screen" class="hidden w-full h-full flex-col relative">
            
            <!-- Top Bar (For Group Calling / Adding Peers) -->
            <div class="absolute top-4 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-[500px] z-20 glass-panel px-4 py-2 rounded-2xl flex items-center gap-2 border border-white/10 shadow-lg">
                <i class="ph-fill ph-user-plus text-gray-400"></i>
                <input type="text" id="add-peer-id" placeholder="Add another ID to this call..." class="flex-1 bg-transparent border-none focus:outline-none text-sm uppercase placeholder-gray-500">
                <button onclick="addPeerToCall()" class="bg-indigo-500 hover:bg-indigo-400 text-xs font-bold px-3 py-1.5 rounded-lg transition">Add</button>
            </div>

            <!-- Video Grid -->
            <div id="video-grid" class="flex-1 w-full h-full grid gap-4 p-4 pt-20 pb-28 auto-rows-fr">
                <!-- Local Video -->
                <div class="relative w-full h-full rounded-3xl overflow-hidden bg-black/50 shadow-2xl border border-white/5">
                    <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover mirror"></video>
                    <div class="absolute bottom-4 left-4 bg-black/60 backdrop-blur-md px-3 py-1 rounded-lg text-sm text-white flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div> You
                    </div>
                </div>
            </div>

            <!-- Bottom Control Bar -->
            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 glass-panel px-6 py-4 rounded-full flex items-center gap-4 sm:gap-6 shadow-2xl border border-white/10">
                <button id="btn-mic" onclick="toggleMic()" class="control-btn bg-white/10 hover:bg-white/20 p-3 sm:p-4 rounded-full transition">
                    <i class="ph-fill ph-microphone text-xl sm:text-2xl"></i>
                </button>
                <button id="btn-cam" onclick="toggleCam()" class="control-btn bg-white/10 hover:bg-white/20 p-3 sm:p-4 rounded-full transition">
                    <i class="ph-fill ph-video-camera text-xl sm:text-2xl"></i>
                </button>
                <button id="btn-screen" onclick="toggleScreenShare()" class="control-btn bg-white/10 hover:bg-white/20 p-3 sm:p-4 rounded-full transition hidden md:block">
                    <i class="ph-fill ph-screencast text-xl sm:text-2xl"></i>
                </button>
                <button id="btn-chat" onclick="toggleChat()" class="control-btn relative bg-white/10 hover:bg-white/20 p-3 sm:p-4 rounded-full transition">
                    <i class="ph-fill ph-chat-circle-dots text-xl sm:text-2xl"></i>
                    <span id="chat-badge" class="hidden absolute top-0 right-0 w-3 h-3 bg-red-500 border-2 border-gray-900 rounded-full"></span>
                </button>
                <button onclick="endCall()" class="control-btn bg-red-500 hover:bg-red-400 text-white p-3 sm:p-4 rounded-full shadow-lg shadow-red-500/40 transition ml-2">
                    <i class="ph-fill ph-phone-disconnect text-xl sm:text-2xl"></i>
                </button>
            </div>

            <!-- Chat Sidebar -->
            <div id="chat-sidebar" class="absolute top-4 right-4 bottom-24 w-80 glass-panel border border-white/10 rounded-2xl flex flex-col shadow-2xl translate-x-[120%] transition-transform duration-300 z-30">
                <div class="p-4 border-b border-white/10 flex justify-between items-center bg-black/20 rounded-t-2xl">
                    <h3 class="font-semibold flex items-center gap-2"><i class="ph-fill ph-chat-centered-text text-indigo-400"></i> In-Call Messages</h3>
                    <button onclick="toggleChat()" class="text-gray-400 hover:text-white"><i class="ph ph-x"></i></button>
                </div>
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar text-sm">
                    <div class="text-center text-xs text-gray-500 mb-2">End-to-End Encrypted Chat</div>
                    <!-- Messages go here -->
                </div>
                <div class="p-3 border-t border-white/10 bg-black/20 rounded-b-2xl">
                    <form id="chat-form" class="flex gap-2" onsubmit="sendChatMessage(event)">
                        <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 bg-black/40 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        <button type="submit" class="bg-indigo-500 hover:bg-indigo-400 p-2 rounded-lg transition"><i class="ph-fill ph-paper-plane-right"></i></button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Incoming Call Overlay -->
        <div id="incoming-call-modal" class="hidden absolute inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center">
            <div class="glass-panel p-8 rounded-3xl text-center max-w-sm w-full border border-white/10">
                <div class="w-20 h-20 bg-indigo-500/20 rounded-full flex items-center justify-center mx-auto mb-4 animate-pulse">
                    <i class="ph-fill ph-phone-ringing text-4xl text-indigo-400"></i>
                </div>
                <h2 class="text-2xl font-bold mb-2">Incoming Call</h2>
                <p class="text-gray-400 mb-8 font-mono text-lg" id="caller-id-display">ID: ...</p>
                <div class="flex gap-4">
                    <button onclick="rejectCall()" class="flex-1 bg-red-500/20 hover:bg-red-500 text-red-500 hover:text-white border border-red-500 py-3 rounded-xl transition">Reject</button>
                    <button onclick="answerCall()" class="flex-1 bg-green-500 hover:bg-green-400 text-white font-bold py-3 rounded-xl shadow-lg shadow-green-500/30 transition">Accept</button>
                </div>
            </div>
        </div>

    </div>

    <div id="toast" class="fixed top-4 right-4 translate-x-full transition-transform duration-300 z-[100] glass-panel px-4 py-3 rounded-xl border border-white/10 flex items-center gap-3">
        <i class="ph-fill ph-info text-indigo-400 text-xl"></i>
        <span id="toast-msg" class="text-sm font-medium"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
